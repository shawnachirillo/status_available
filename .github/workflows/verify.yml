name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STATUS_TEST_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install PostgreSQL 17 binaries
        shell: bash
        run: |
          if [[ ! -x "$STATUS_TEST_PG_BIN/postgres" ]]; then
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location               https://www.postgresql.org/media/keys/ACCC4CF8.asc               --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main'               | sudo tee /etc/apt/sources.list.d/status-postgresql.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          fi
          "$STATUS_TEST_PG_BIN/postgres" --version
      - run: npm ci --no-audit --no-fund
      - name: Build, type-check and run the isolated regression suite
        run: npm test
